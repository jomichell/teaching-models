  site-url: https://jomichell.github.io/teaching-models/
  repo-url: https://github.com/jomichell/teaching-models
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: Models
        menu:
          - href: solow/index.qmd
            text: Solow growth model
          - href: solow/shock.qmd
